services:
  - type: web
    name: imsnetpairinfotech
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://imsnetpairinfotech.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: netpairinfotechllp@gmail.com
      - key: EMAIL_FROM_NAME
        value: NetPair IMS
